    <!--
      Fonts load without blocking the first paint: preload fetches the stylesheet at high
      priority, and applying it as `media="print"` keeps it off the critical path until onload
      swaps it in. The families fall back to system serif/mono until then, and `display=swap`
      means text is never invisible.
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400&display=swap">

    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400&display=swap"></noscript>
